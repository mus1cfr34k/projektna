name: Build Quality Radar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk QualityRadar.apk

      - name: Verify APK contents
        run: |
          unzip -l QualityRadar.apk | grep -E 'classes.dex|assets/index.html|AndroidManifest.xml'
          ls -lh QualityRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QualityRadar-APK
          path: QualityRadar.apk
          if-no-files-found: error
          retention-days: 7
